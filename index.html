<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pixel Runner</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0d0d1a;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100vh; font-family:'Courier New',monospace;
  overflow:hidden; touch-action:none; user-select:none;
}
#wrap { position:relative; width:800px; max-width:100vw; }
#hud {
  display:flex; justify-content:space-between; align-items:center;
  padding:6px 12px; color:#fff; font-size:13px; background:rgba(0,0,0,0.4);
  border-radius:6px 6px 0 0;
}
#hud span { color:#ffd700; font-weight:bold; }
#canvas { display:block; width:100%; border:2px solid #333; }
#controls {
  display:flex; gap:10px; padding:8px; justify-content:center;
  background:rgba(0,0,0,0.3); border-radius:0 0 6px 6px;
}
.ctrl-btn {
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2);
  color:#fff; font-size:20px; width:60px; height:50px; border-radius:8px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:background 0.1s; -webkit-user-select:none; user-select:none;
}
.ctrl-btn:active, .ctrl-btn.pressed { background:rgba(255,255,255,0.25); }

/* LOBBY SCREEN */
#lobby {
  position:absolute; inset:0; background:linear-gradient(160deg,#0d0d1a,#1a0a2e);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:0; z-index:10; border-radius:2px;
}
.lobby-title { font-size:42px; font-weight:bold; color:#ffd700; letter-spacing:3px; text-shadow:0 0 20px #ffd70088; margin-bottom:4px; }
.lobby-sub { font-size:13px; color:#888; margin-bottom:28px; }
.lobby-coins { font-size:18px; color:#ffd700; margin-bottom:22px; }
.lobby-coins span { font-size:22px; font-weight:bold; }
.lbtn {
  width:220px; padding:12px 0; border-radius:10px; border:none; cursor:pointer;
  font-family:'Courier New',monospace; font-size:16px; font-weight:bold;
  margin:6px 0; transition:transform 0.1s, box-shadow 0.1s;
}
.lbtn:active { transform:scale(0.96); }
.lbtn-play { background:linear-gradient(135deg,#ffd700,#ff9800); color:#1a1a1a; box-shadow:0 4px 18px #ffd70066; }
.lbtn-levels { background:rgba(255,255,255,0.08); color:#fff; border:1px solid rgba(255,255,255,0.2); }
.lbtn-shop { background:linear-gradient(135deg,#7c3aed,#a855f7); color:#fff; box-shadow:0 4px 18px #7c3aed66; }

/* LEVEL SELECT */
#levelScreen {
  position:absolute; inset:0; background:linear-gradient(160deg,#0d0d1a,#1a0a2e);
  display:none; flex-direction:column; align-items:center; padding:20px;
  z-index:10; border-radius:2px; overflow-y:auto;
}
.screen-title { font-size:26px; color:#ffd700; margin-bottom:16px; font-weight:bold; }
.level-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; width:100%; max-width:460px; margin-bottom:16px; }
.lvl-btn {
  aspect-ratio:1; border-radius:10px; border:2px solid transparent; cursor:pointer;
  font-family:'Courier New',monospace; font-size:15px; font-weight:bold;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:transform 0.1s;
}
.lvl-btn:active { transform:scale(0.93); }
.lvl-unlocked { background:rgba(255,215,0,0.15); border-color:#ffd700; color:#ffd700; }
.lvl-locked { background:rgba(255,255,255,0.04); border-color:#333; color:#444; cursor:not-allowed; }
.lvl-btn small { font-size:9px; color:#888; margin-top:2px; }

/* SHOP */
#shopScreen {
  position:absolute; inset:0; background:linear-gradient(160deg,#0d0d1a,#1a0a2e);
  display:none; flex-direction:column; align-items:center; padding:20px;
  z-index:10; border-radius:2px; overflow-y:auto;
}
.skin-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; width:100%; max-width:500px; margin-bottom:16px; }
.skin-card {
  background:rgba(255,255,255,0.04); border:2px solid #333; border-radius:12px;
  padding:14px 8px; text-align:center; cursor:pointer; transition:border-color 0.2s;
}
.skin-card.owned { border-color:#4caf50; }
.skin-card.active { border-color:#ffd700; box-shadow:0 0 12px #ffd70066; }
.skin-preview { width:36px; height:48px; margin:0 auto 8px; border-radius:4px; position:relative; display:flex; align-items:center; justify-content:center; }
.skin-name { font-size:12px; color:#ccc; margin-bottom:4px; }
.skin-price { font-size:11px; color:#ffd700; }
.skin-price.free { color:#4caf50; }
.skin-price.owned-label { color:#4caf50; }
.btn-back {
  padding:8px 22px; border-radius:8px; border:1px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.06); color:#fff; cursor:pointer;
  font-family:'Courier New',monospace; font-size:13px;
}

/* OVERLAY BTNS on canvas */
#overlayBtns {
  position:absolute; bottom:60px; left:50%; transform:translateX(-50%);
  display:none; gap:12px; z-index:5; flex-direction:column; align-items:center;
}
.obtn {
  padding:10px 28px; border-radius:10px; border:none; cursor:pointer;
  font-family:'Courier New',monospace; font-size:15px; font-weight:bold;
  transition:transform 0.1s;
}
.obtn:active { transform:scale(0.95); }
.obtn-retry { background:linear-gradient(135deg,#ff9800,#f44336); color:#fff; }
.obtn-lobby { background:rgba(255,255,255,0.12); color:#fff; border:1px solid rgba(255,255,255,0.2); }
.obtn-next  { background:linear-gradient(135deg,#ffd700,#ff9800); color:#1a1a1a; }
</style>
</head>
<body>
<div id="wrap">
  <!-- HUD -->
  <div id="hud">
    <div>❤️ <span id="hpTxt">4</span> &nbsp;🪙 <span id="coinTxt">0</span></div>
    <div>Level <span id="lvlTxt">1</span></div>
    <div>Skor: <span id="scoreTxt">0</span></div>
  </div>
  <canvas id="canvas" width="800" height="450"></canvas>
  <div id="controls">
    <button class="ctrl-btn" id="btnLeft">◀</button>
    <button class="ctrl-btn" id="btnJump">⬆</button>
    <button class="ctrl-btn" id="btnRight">▶</button>
  </div>

  <!-- Overlay buttons (retry / lobby / next) -->
  <div id="overlayBtns">
    <div style="display:flex;gap:12px;" id="overlayRow"></div>
  </div>

  <!-- LOBBY -->
  <div id="lobby">
    <div class="lobby-title">PIXEL GAME</div>
    <div class="lobby-sub">Game gabut admin</div>
    <div class="lobby-coins">🪙 DUIT : <span id="totalCoinsTxt">0</span></div>
    <button class="lbtn lbtn-play" id="btnPlay">▶ GASSSZ</button>
    <button class="lbtn lbtn-levels" id="btnLevels">🗺 LEVEL</button>
    <button class="lbtn lbtn-shop" id="btnShop">🎨 Beli Skin WOYY</button>
  </div>

  <!-- LEVEL SELECT -->
  <div id="levelScreen">
    <div class="screen-title">🗺 Pilih Level</div>
    <div class="level-grid" id="levelGrid"></div>
    <button class="btn-back" id="btnBackFromLevels">← Kembali</button>
  </div>

  <!-- SHOP -->
  <div id="shopScreen">
    <div class="screen-title">🎨 Skin Shop</div>
    <div style="font-size:13px;color:#888;margin-bottom:12px;">🪙 Duit: <span id="shopCoins" style="color:#ffd700;font-weight:bold;">0</span></div>
    <div class="skin-grid" id="skinGrid"></div>
    <h3>SKIN NYA CUMA GANTI WARNA WKWKWK</h3>
    <button class="btn-back" id="btnBackFromShop">← Kembali</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 800, H = 450;

// ============================
// PERSISTENT SAVE (localStorage)
// ============================
function save() {
  try {
    localStorage.setItem('pr_save', JSON.stringify({
      totalCoins, unlockedLevels: [...unlockedLevels], activeSkin, ownedSkins: [...ownedSkins]
    }));
  } catch(e){}
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('pr_save') || '{}');
    if (d.totalCoins !== undefined) totalCoins = d.totalCoins;
    if (d.unlockedLevels) unlockedLevels = new Set(d.unlockedLevels);
    if (d.activeSkin) activeSkin = d.activeSkin;
    if (d.ownedSkins) ownedSkins = new Set(d.ownedSkins);
  } catch(e){}
}

// ============================
// SKINS
// ============================
const SKINS = [
  { id:'blue',   name:'Biru',    body:'#4fc3f7', shade:'#0288d1', hat:'#1565c0', leg:'#1a237e', price:0 },
  { id:'red',    name:'Merah',   body:'#ef5350', shade:'#b71c1c', hat:'#b71c1c', leg:'#7f0000', price:30 },
  { id:'green',  name:'Hijau',   body:'#66bb6a', shade:'#2e7d32', hat:'#2e7d32', leg:'#1b5e20', price:30 },
  { id:'purple', name:'Ungu',    body:'#ab47bc', shade:'#6a1b9a', hat:'#6a1b9a', leg:'#38006b', price:50 },
  { id:'orange', name:'Oranye',  body:'#ffa726', shade:'#e65100', hat:'#e65100', leg:'#bf360c', price:50 },
  { id:'pink',   name:'Pink',    body:'#f48fb1', shade:'#ad1457', hat:'#ad1457', leg:'#880e4f', price:50 },
  { id:'cyan',   name:'Cyan',    body:'#26c6da', shade:'#00838f', hat:'#00838f', leg:'#006064', price:80 },
  { id:'gold',   name:'Emas',    body:'#ffd700', shade:'#ff8f00', hat:'#ff8f00', leg:'#e65100', price:100 },
  { id:'dark',   name:'Gelap',   body:'#455a64', shade:'#1c313a', hat:'#1c313a', leg:'#000a12', price:100 },
];

let totalCoins = 0;
let unlockedLevels = new Set([1]);
let activeSkin = 'blue';
let ownedSkins = new Set(['blue']);
const MAX_LEVELS = 10;

load();

function getSkin() { return SKINS.find(s => s.id === activeSkin) || SKINS[0]; }

// ============================
// SCREENS
// ============================
let appScreen = 'lobby'; // 'lobby'|'levelselect'|'shop'|'game'

function showScreen(s) {
  appScreen = s;
  document.getElementById('lobby').style.display       = s === 'lobby'       ? 'flex' : 'none';
  document.getElementById('levelScreen').style.display  = s === 'levelselect' ? 'flex' : 'none';
  document.getElementById('shopScreen').style.display   = s === 'shop'        ? 'flex' : 'none';
  document.getElementById('hud').style.display          = s === 'game'        ? 'flex' : 'none';
  document.getElementById('controls').style.display     = s === 'game'        ? 'flex' : 'none';
  if (s === 'lobby')       refreshLobby();
  if (s === 'levelselect') refreshLevelSelect();
  if (s === 'shop')        refreshShop();
}

function refreshLobby() {
  document.getElementById('totalCoinsTxt').textContent = totalCoins;
}
function refreshLevelSelect() {
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';
  for (let i = 1; i <= MAX_LEVELS; i++) {
    const btn = document.createElement('button');
    btn.className = 'lvl-btn ' + (unlockedLevels.has(i) ? 'lvl-unlocked' : 'lvl-locked');
    btn.innerHTML = `<span>${i}</span><small>${unlockedLevels.has(i) ? '▶' : '🔒'}</small>`;
    if (unlockedLevels.has(i)) btn.onclick = () => startGame(i);
    grid.appendChild(btn);
  }
}
function refreshShop() {
  document.getElementById('shopCoins').textContent = totalCoins;
  const grid = document.getElementById('skinGrid');
  grid.innerHTML = '';
  SKINS.forEach(sk => {
    const card = document.createElement('div');
    const isOwned = ownedSkins.has(sk.id);
    const isActive = activeSkin === sk.id;
    card.className = 'skin-card' + (isOwned ? ' owned' : '') + (isActive ? ' active' : '');
    const preview = `<div class="skin-preview">
      <canvas width="36" height="54" id="prev_${sk.id}"></canvas>
    </div>`;
    const label = isActive ? '<span class="skin-price owned-label">✓ Dipakai</span>'
      : isOwned ? '<span class="skin-price owned-label">✓ Punya</span>'
      : `<span class="skin-price">🪙 ${sk.price}</span>`;
    card.innerHTML = preview + `<div class="skin-name">${sk.name}</div>` + label;
    card.onclick = () => handleSkinClick(sk);
    grid.appendChild(card);
    // draw mini preview
    setTimeout(() => drawSkinPreview(sk), 10);
  });
}
function drawSkinPreview(sk) {
  const c = document.getElementById('prev_' + sk.id);
  if (!c) return;
  const x = c.getContext('2d');
  x.clearRect(0,0,36,54);
  // body
  x.fillStyle = sk.body;
  x.fillRect(2, 14, 22, 22);
  x.fillStyle = sk.shade;
  x.fillRect(19, 14, 5, 22);
  x.fillRect(2, 31, 22, 5);
  // head
  x.fillStyle = '#ffe0b2';
  x.fillRect(4, 4, 18, 12);
  // eye
  x.fillStyle = '#111';
  x.fillRect(17, 6, 4, 4);
  x.fillStyle = '#fff';
  x.fillRect(16, 5, 3, 3);
  // hat
  x.fillStyle = sk.hat;
  x.fillRect(2, -1, 22, 7);
  x.fillRect(6, -6, 14, 6);
  // legs
  x.fillStyle = sk.leg;
  x.fillRect(3, 36, 7, 8);
  x.fillRect(16, 36, 7, 8);
}
function handleSkinClick(sk) {
  if (ownedSkins.has(sk.id)) {
    activeSkin = sk.id;
    save();
    refreshShop();
    return;
  }
  if (totalCoins >= sk.price) {
    totalCoins -= sk.price;
    ownedSkins.add(sk.id);
    activeSkin = sk.id;
    save();
    refreshShop();
  } else {
    alert('Koin tidak cukup! Butuh 🪙' + sk.price + ', kamu punya 🪙' + totalCoins);
  }
}

// ============================
// GAME STATE
// ============================
let keys = {}, touchLeft=false, touchRight=false, touchJump=false;
let gameState = 'idle'; // idle|play|dead|win|gameover|doorenter
let score=0, sessionCoins=0, hp=4, level=1;
let cameraX=0, particles=[], stars=[];

for (let i=0;i<80;i++)
  stars.push({x:Math.random()*W*4,y:Math.random()*H*0.6,r:Math.random()*1.2+0.3,a:Math.random()});

// ============================
// LEVEL DATA
// ============================
function makeLevelData(lvl) {
  const worldW = 2400 + lvl * 360;
  const seed = lvl * 31;
  function rng(n) { return ((seed * 9301 + n * 49297) % 233280) / 233280; }

  const difficulty = lvl - 1;
  const platforms = [];
  const groundSegments = [
    {x:0, y:380, w:260 + lvl * 10, h:70},
    {x:340, y:380, w:220, h:70},
    {x:640, y:380, w:240, h:70},
    {x:960, y:380, w:240, h:70},
    {x:1280, y:380, w:260, h:70},
    {x:1630, y:380, w:240, h:70},
    {x:1960, y:380, w:240, h:70},
    {x:2260, y:380, w:worldW - 2260, h:70},
  ];
  const skipStart = Math.min(groundSegments.length - 1, 2 + Math.floor(difficulty * 0.5));
  const skipCount = Math.min(1, Math.floor(difficulty / 6));
  groundSegments.forEach((seg, idx) => {
    if (idx >= skipStart && idx < skipStart + skipCount) return;
    platforms.push(seg);
  });

  const floats = [];
  const floatCount = 3 + Math.floor(lvl / 2);
  const movingCount = Math.max(0, Math.floor((lvl - 4) / 3));
  for (let i = 0; i < floatCount; i++) {
    const baseX = 170 + i * 165 + Math.floor(rng(i) * 60);
    const baseY = 220 + Math.floor(rng(i + 10) * 120);
    floats.push({
      x: baseX,
      y: baseY,
      w: 70 + Math.floor(rng(i + 20) * 70),
      h: 16,
      motion: i < movingCount ? {
        axis: i % 2 === 0 ? 'x' : 'y',
        amp: 16 + Math.floor(rng(i + 30) * 10),
        speed: 0.012 + lvl * 0.002,
        phase: rng(i + 40) * Math.PI * 2,
        baseX,
        baseY
      } : null
    });
  }
  floats.forEach((f, i) => {
    platforms.push({
      x: f.x,
      y: f.y + Math.floor(rng(i * 7) * 20 - 10),
      w: f.w,
      h: f.h,
      motion: f.motion
    });
  });

  const spikes = [];
  for (let i = 0; i < Math.max(0, difficulty - 1); i++) {
    const groupX = 430 + i * 170 + Math.floor(rng(i + 50) * 40);
    const spikeCount = 1 + (i % 2);
    for (let s = 0; s < spikeCount; s++) {
      spikes.push({x: groupX + s * 26, y: 358, w: 18, h: 22});
    }
  }

  const coins = [];
  platforms.forEach((p, pi) => {
    const n = Math.max(1, Math.floor(p.w / (p.motion ? 64 : 52)));
    for (let i = 0; i < n; i++) {
      if (rng(pi * 100 + i) > 0.25) {
        coins.push({x:p.x+30+i*48, y:p.y-28, collected:false, bob:rng(pi+i)*Math.PI*2});
      }
    }
  });

  for (let i = 0; i < Math.max(0, difficulty - 1); i++) {
    coins.push({x:520 + i * 180, y:180 + (i % 2) * 40, collected:false, bob:rng(i + 80) * Math.PI * 2});
  }

  const enemies = [];
  const enemyPlats = platforms.filter(p => p.h > 20 && p.w > 160);
  enemyPlats.forEach((p, i) => {
    const count = Math.min(1 + Math.floor(difficulty / 4), 1 + Math.floor(p.w / 260));
    for (let e = 0; e < count; e++) {
      enemies.push({
        x:p.x+30+e*78, y:p.y-30, w:24, h:30,
        vx:(i % 2 === 0 ? 1 : -1) * (0.8 + lvl * 0.1 + e * 0.12),
        patrolLeft:p.x+10, patrolRight:p.x+p.w-10,
        dead:false, deathTimer:0, frame:0, frameTimer:0
      });
    }
  });

  const doorX = worldW - 80;
  return {platforms, coins, enemies, spikes, worldW, doorX};
}

let lvlData = {};

// ============================
// PLAYER
// ============================
function makePlayer() {
  return {
    x:60,y:320,w:22,h:30,
    vx:0,vy:0,onGround:false,facing:1,
    frame:0,frameTimer:0,invincible:0,
    jumpBuffer:0,coyote:0
  };
}
let player = makePlayer();

// ============================
// HELPERS
// ============================
function rectOverlap(a,b) {
  return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
}
function spawnParticles(x,y,color,n=8) {
  for (let i=0;i<n;i++) {
    const angle=(Math.PI*2*i)/n+Math.random()*0.5;
    const speed=2+Math.random()*3;
    particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-1,life:1,color,r:3+Math.random()*3});
  }
}
function showOverlayBtns(mode) {
  const div = document.getElementById('overlayBtns');
  const row = document.getElementById('overlayRow');
  div.style.display = 'flex';
  row.innerHTML = '';
  if (mode === 'dead') {
    const retry = document.createElement('button');
    retry.className='obtn obtn-retry'; retry.textContent='🔄 Coba Lagi';
    retry.onclick = () => { hideOverlayBtns(); respawn(); };
    const lobby = document.createElement('button');
    lobby.className='obtn obtn-lobby'; lobby.textContent='🏠 Lobby';
    lobby.onclick = () => { hideOverlayBtns(); goLobby(); };
    row.appendChild(retry); row.appendChild(lobby);
  } else if (mode === 'gameover') {
    const retry = document.createElement('button');
    retry.className='obtn obtn-retry'; retry.textContent='🔄 Mulai Ulang';
    retry.onclick = () => { hideOverlayBtns(); startGame(level); };
    const lobby = document.createElement('button');
    lobby.className='obtn obtn-lobby'; lobby.textContent='🏠 Lobby';
    lobby.onclick = () => { hideOverlayBtns(); goLobby(); };
    row.appendChild(retry); row.appendChild(lobby);
  } else if (mode === 'win') {
    const next = document.createElement('button');
    next.className='obtn obtn-next'; next.textContent='Level Berikutnya ▶';
    next.onclick = () => { hideOverlayBtns(); nextLevel(); };
    const lobby = document.createElement('button');
    lobby.className='obtn obtn-lobby'; lobby.textContent='🏠 Lobby';
    lobby.onclick = () => { hideOverlayBtns(); goLobby(); };
    row.appendChild(next); row.appendChild(lobby);
  }
}
function hideOverlayBtns() {
  document.getElementById('overlayBtns').style.display = 'none';
}

function startGame(lvl) {
  level = lvl;
  score = 0; sessionCoins = 0; hp = 4;
  cameraX = 0; particles = [];
  lvlData = makeLevelData(level);
  player = makePlayer();
  gameState = 'play';
  hideOverlayBtns();
  showScreen('game');
  updateHUD();
}
function respawn() {
  player = makePlayer();
  lvlData = makeLevelData(level);
  cameraX = 0; particles = [];
  gameState = 'play';
  updateHUD();
}
function nextLevel() {
  level++;
  if (level > MAX_LEVELS) level = MAX_LEVELS;
  unlockedLevels.add(level);
  save();
  startGame(level);
}
function goLobby() {
  gameState = 'idle';
  showScreen('lobby');
}
function updateHUD() {
  document.getElementById('hpTxt').textContent = hp;
  document.getElementById('coinTxt').textContent = sessionCoins;
  document.getElementById('scoreTxt').textContent = score;
  document.getElementById('lvlTxt').textContent = level;
}

// ============================
// UPDATE
// ============================
let doorAnim = 0;
function update(dt) {
  if (gameState !== 'play' && gameState !== 'doorenter') return;

  doorAnim += 0.05;
  updateMovingPlatforms(performance.now());

  const p = player;
  if (gameState === 'doorenter') {
    // walk into door
    p.x += 2;
    p.vy += 0.3;
    if (p.x > lvlData.doorX + 50) {
      // finalize
      totalCoins += sessionCoins;
      save();
      gameState = 'win';
      showOverlayBtns('win');
    }
    updateCamera();
    updateParticles();
    return;
  }

  const left  = keys['ArrowLeft']  || keys['a'] || touchLeft;
  const right = keys['ArrowRight'] || keys['d'] || touchRight;
  const jump  = keys['ArrowUp']    || keys['z'] || keys[' '] || touchJump;

  const speed=3.5, accel=0.6, friction=0.8;
  if (left)       { p.vx -= accel; p.facing=-1; }
  else if (right) { p.vx += accel; p.facing=1; }
  else            { p.vx *= friction; }
  p.vx = Math.max(-speed, Math.min(speed, p.vx));

  p.vy += 0.55;
  if (p.vy > 14) p.vy = 14;

  if (p.onGround) p.coyote=8; else if (p.coyote>0) p.coyote--;
  if (jump) p.jumpBuffer=8; else if (p.jumpBuffer>0) p.jumpBuffer--;
  if (p.jumpBuffer>0 && p.coyote>0) {
    p.vy=-11; p.coyote=0; p.jumpBuffer=0;
    spawnParticles(p.x+p.w/2, p.y+p.h, getSkin().body, 6);
  }

  p.x += p.vx;
  p.onGround = false;
  for (const pl of lvlData.platforms) {
    if (rectOverlap(p,pl)) {
      if (p.vx>0) p.x=pl.x-p.w; else p.x=pl.x+pl.w;
      p.vx=0;
    }
  }

  p.y += p.vy;
  for (const pl of lvlData.platforms) {
    if (rectOverlap(p,pl)) {
      if (p.vy>0) { p.y=pl.y-p.h; p.vy=0; p.onGround=true; }
      else        { p.y=pl.y+pl.h; p.vy=2; }
    }
  }

  if (p.x<0) p.x=0;
  if (p.x+p.w>lvlData.worldW) p.x=lvlData.worldW-p.w;

  // Fall death
  if (p.y > H+60) { killPlayer(); return; }

  // Coins
  for (const c of lvlData.coins) {
    if (!c.collected && rectOverlap(p,{x:c.x-8,y:c.y-8,w:16,h:16})) {
      c.collected=true; sessionCoins++; score+=10;
      spawnParticles(c.x, c.y, '#ffd700', 10);
      updateHUD();
    }
    c.bob+=0.05;
  }

  // Enemies
  for (const e of lvlData.enemies) {
    if (e.dead) { e.deathTimer--; continue; }
    e.x += e.vx;
    if (e.x<e.patrolLeft||e.x+e.w>e.patrolRight) e.vx*=-1;
    e.frameTimer++; if(e.frameTimer>15){e.frame=(e.frame+1)%2;e.frameTimer=0;}

    if (p.invincible<=0 && rectOverlap(p,e)) {
      if (p.vy>1 && p.y+p.h < e.y+e.h*0.5+8) {
        e.dead=true; e.deathTimer=30; p.vy=-8; score+=50;
        spawnParticles(e.x+e.w/2,e.y+e.h/2,'#e57373',12); updateHUD();
      } else {
        hp--; p.invincible=90;
        p.vy=-7; p.vx=p.x<e.x+e.w/2?-5:5;
        spawnParticles(p.x+p.w/2,p.y+p.h/2,'#ff4444',10);
        updateHUD();
        if (hp<=0) { killPlayer(); return; }
      }
    }
  }

  if (p.invincible>0) p.invincible--;

  for (const sp of (lvlData.spikes || [])) {
    if (rectOverlap(p, sp) && p.invincible <= 0) {
      hp--;
      p.invincible = 60;
      p.vy = -8;
      p.vx = p.x < sp.x ? -4 : 4;
      spawnParticles(p.x + p.w/2, p.y + p.h/2, '#ff5252', 10);
      updateHUD();
      if (hp <= 0) { killPlayer(); return; }
    }
  }

  // Animation
  if (Math.abs(p.vx)>0.5) { p.frameTimer++; if(p.frameTimer>8){p.frame=(p.frame+1)%4;p.frameTimer=0;} }
  else p.frame=0;

  // Door collision — enter next level
  const door = {x:lvlData.doorX, y:290, w:36, h:90};
  if (rectOverlap(p, door)) {
    gameState='doorenter';
    spawnParticles(door.x+18, door.y+45, '#ffd700', 20);
    return;
  }

  updateParticles();
  updateCamera();
}

function killPlayer() {
  spawnParticles(player.x+player.w/2, player.y, getSkin().body, 14);
  if (hp<=0) {
    totalCoins += sessionCoins;
    save();
    gameState='gameover';
    showOverlayBtns('gameover');
  } else {
    gameState='dead';
    showOverlayBtns('dead');
  }
}

function updateCamera() {
  const targetCX = player.x - W/2 + player.w/2;
  cameraX += (targetCX - cameraX)*0.1;
  cameraX = Math.max(0, Math.min(lvlData.worldW - W, cameraX));
}
function updateParticles() {
  for (const pt of particles) { pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.15; pt.life-=0.028; }
  particles = particles.filter(pt=>pt.life>0);
}

function updateMovingPlatforms(timeMs) {
  const t = timeMs * 0.001;
  for (const pl of lvlData.platforms) {
    if (!pl.motion) continue;
    const wave = Math.sin(t * (pl.motion.speed * 60) + pl.motion.phase) * pl.motion.amp;
    if (pl.motion.axis === 'x') {
      pl.x = pl.motion.baseX + wave;
      pl.y = pl.motion.baseY;
    } else {
      pl.x = pl.motion.baseX;
      pl.y = pl.motion.baseY + wave;
    }
  }
}

// ============================
// DRAW
// ============================
function drawBg() {
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0d0d1a'); g.addColorStop(1,'#1a1a3e');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';
  for (const s of stars) {
    const sx=(s.x-cameraX*0.12)%((W+200)*3);
    if (sx<-5||sx>W+5) continue;
    ctx.globalAlpha=0.3+0.7*s.a*Math.abs(Math.sin(Date.now()*0.001+s.a*10));
    ctx.beginPath(); ctx.arc(sx,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  // Moon
  ctx.fillStyle='#fffde7'; ctx.beginPath(); ctx.arc(W-80,60,28,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1a1a3e'; ctx.beginPath(); ctx.arc(W-70,55,24,0,Math.PI*2); ctx.fill();
}

function drawPlatform(pl) {
  const x=pl.x-cameraX, y=pl.y;
  ctx.fillStyle='#5c4033'; ctx.fillRect(x,y+6,pl.w,pl.h-6);
  ctx.fillStyle='#8b6347'; ctx.fillRect(x,y,pl.w,6);
  ctx.fillStyle='rgba(255,255,255,0.05)';
  for (let i=0;i<pl.w;i+=16) ctx.fillRect(x+i,y,8,3);
}

function drawSpike(sp) {
  const sx = sp.x - cameraX;
  ctx.fillStyle = '#b71c1c';
  ctx.beginPath();
  ctx.moveTo(sx, sp.y + sp.h);
  ctx.lineTo(sx + sp.w / 2, sp.y);
  ctx.lineTo(sx + sp.w, sp.y + sp.h);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ff5252';
  ctx.fillRect(sx + 2, sp.y + sp.h - 6, sp.w - 4, 5);
}

function drawCoin(c) {
  if (c.collected) return;
  const cx=c.x-cameraX, cy=c.y+Math.sin(c.bob)*4;
  ctx.save();
  ctx.shadowColor='#ffd700'; ctx.shadowBlur=10;
  ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.arc(cx,cy,7,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.fillStyle='#fff8'; ctx.beginPath(); ctx.arc(cx-2,cy-2,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#b8860b'; ctx.font='bold 8px Courier New'; ctx.textAlign='center';
  ctx.fillText('$',cx,cy+3);
}

function drawEnemy(e) {
  if (e.dead) return;
  const ex=e.x-cameraX;
  ctx.fillStyle='#e57373'; ctx.fillRect(ex,e.y,e.w,e.h);
  ctx.fillStyle='#c62828';
  ctx.fillRect(ex+e.w-6,e.y,6,e.h); ctx.fillRect(ex,e.y+e.h-6,e.w,6);
  ctx.fillStyle='#fff';
  const eo=e.vx>0?e.w-10:2;
  ctx.fillRect(ex+eo,e.y+5,8,7);
  ctx.fillStyle='#111'; ctx.fillRect(ex+eo+(e.vx>0?3:1),e.y+7,4,4);
  ctx.fillStyle='#c62828';
  const leg=e.frame===0?0:3;
  ctx.fillRect(ex+2,e.y+e.h,7,5+leg); ctx.fillRect(ex+e.w-9,e.y+e.h,7,5+(leg?0:3));
  ctx.fillStyle='#ff5252';
  for (let i=0;i<3;i++) {
    ctx.beginPath();
    const sx=ex+3+i*8;
    ctx.moveTo(sx,e.y); ctx.lineTo(sx+4,e.y-6); ctx.lineTo(sx+8,e.y); ctx.fill();
  }
}

function drawDoor() {
  const dx = lvlData.doorX - cameraX;
  if (dx < -60 || dx > W+10) return;
  const dy = 290, dw=36, dh=90;

  // Glow pulse
  const pulse = 0.5+0.5*Math.sin(doorAnim*2);
  ctx.save();
  ctx.shadowColor='#ffd700'; ctx.shadowBlur=20+pulse*15;

  // Frame
  ctx.fillStyle='#b8860b';
  ctx.fillRect(dx-4,dy-4,dw+8,dh+4);
  ctx.fillStyle='#7a5c1a';
  ctx.fillRect(dx,dy,dw,dh);

  // Portal swirl inside
  const cx2=dx+dw/2, cy2=dy+dh/2;
  for (let r=14;r>0;r-=3) {
    const hue = (doorAnim*60 + r*20) % 360;
    ctx.globalAlpha=0.25+r*0.04;
    ctx.fillStyle=`hsl(${hue},80%,60%)`;
    ctx.beginPath();
    ctx.arc(cx2, cy2, r, doorAnim+(14-r)*0.3, doorAnim+(14-r)*0.3+Math.PI*(1.2+pulse*0.4));
    ctx.arc(cx2, cy2, r-2, doorAnim+(14-r)*0.3+Math.PI*(1.2+pulse*0.4), doorAnim+(14-r)*0.3, true);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha=1;

  // Stars around door
  for (let i=0;i<5;i++) {
    const angle=doorAnim+i*Math.PI*2/5;
    const sr=dw*0.9, sx2=cx2+Math.cos(angle)*sr*0.5, sy2=cy2+Math.sin(angle)*sr*0.7;
    ctx.fillStyle='#ffd700';
    ctx.globalAlpha=0.5+0.5*Math.sin(doorAnim*3+i);
    ctx.beginPath(); ctx.arc(sx2,sy2,2.5,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // Label
  ctx.restore();
  ctx.fillStyle='#ffd700'; ctx.font='bold 9px Courier New'; ctx.textAlign='center';
  ctx.fillText('PINTU', dx+dw/2, dy-8);
}

function drawPlayer() {
  const p=player;
  if (p.invincible>0 && Math.floor(p.invincible/5)%2===0) return;
  const px=p.x-cameraX;
  const sk=getSkin();

  ctx.save();
  if (p.facing===-1) { ctx.translate(px+p.w,p.y); ctx.scale(-1,1); }
  else               { ctx.translate(px,p.y); }

  ctx.fillStyle=sk.body;    ctx.fillRect(0,8,p.w,p.h-8);
  ctx.fillStyle=sk.shade;   ctx.fillRect(p.w-5,8,5,p.h-8); ctx.fillRect(0,p.h-7,p.w,7);
  ctx.fillStyle='#ffe0b2';  ctx.fillRect(2,0,p.w-4,12);
  ctx.fillStyle='#111';     ctx.fillRect(p.w-7,3,4,4);
  ctx.fillStyle='#fff';     ctx.fillRect(p.w-8,2,3,3);
  ctx.fillStyle=sk.hat;     ctx.fillRect(0,-6,p.w,8); ctx.fillRect(4,-10,p.w-8,6);
  const legL=p.onGround?(p.frame%2===0?0:4):0;
  ctx.fillStyle=sk.leg;
  ctx.fillRect(1,p.h,8,8+legL); ctx.fillRect(p.w-9,p.h,8,8+(4-legL));
  ctx.restore();
}

function drawParticles() {
  for (const pt of particles) {
    ctx.globalAlpha=pt.life; ctx.fillStyle=pt.color;
    ctx.beginPath(); ctx.arc(pt.x-cameraX,pt.y,pt.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawOverlay() {
  ctx.textAlign='center';
  if (gameState==='dead') {
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff5252'; ctx.font='bold 38px Courier New';
    ctx.fillText('CUPU AMAT!', W/2, H/2-30);
    ctx.fillStyle='#888'; ctx.font='16px Courier New';
    ctx.fillText('Nyawa tersisa: '+hp, W/2, H/2+5);
  }
  if (gameState==='gameover') {
    ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff5252'; ctx.font='bold 48px Courier New';
    ctx.fillText('GAME OVER', W/2, H/2-40);
    ctx.fillStyle='#ffd700'; ctx.font='20px Courier New';
    ctx.fillText('Skor: '+score+' | Koin: '+sessionCoins, W/2, H/2+5);
  }
  if (gameState==='win') {
    ctx.fillStyle='rgba(0,15,30,0.7)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffd700'; ctx.font='bold 42px Courier New';
    ctx.fillText('JAGO JUGA LO ', W/2, H/2-35);
    ctx.fillStyle='#4fc3f7'; ctx.font='18px Courier New';
    ctx.fillText('Koin +'+sessionCoins+' | Skor: '+score, W/2, H/2+5);
  }
}

// ============================
// IDLE (lobby background anim)
// ============================
let idleT = 0;
function drawIdle() {
  idleT += 0.016;
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0d0d1a'); g.addColorStop(1,'#1a1a3e');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';
  for (const s of stars) {
    const sx=(s.x)%W;
    ctx.globalAlpha=0.2+0.5*s.a*Math.abs(Math.sin(idleT+s.a*10));
    ctx.beginPath(); ctx.arc(sx,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ============================
// LOOP
// ============================
let last=0;
function loop(ts) {
  const dt=Math.min(ts-last,32); last=ts;

  if (appScreen!=='game') {
    drawIdle();
    requestAnimationFrame(loop);
    return;
  }

  update(dt);
  ctx.clearRect(0,0,W,H);
  drawBg();
  for (const pl of lvlData.platforms) drawPlatform(pl);
  for (const sp of (lvlData.spikes || [])) drawSpike(sp);
  drawDoor();
  for (const c of lvlData.coins) drawCoin(c);
  for (const e of lvlData.enemies) drawEnemy(e);
  drawPlayer();
  drawParticles();
  drawOverlay();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ============================
// INPUT
// ============================
window.addEventListener('keydown',e=>{keys[e.key]=true; if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();});
window.addEventListener('keyup',e=>{keys[e.key]=false;});

function addTouch(btn,setFn,val) {
  btn.addEventListener('touchstart',e=>{e.preventDefault();setFn(val);btn.classList.add('pressed');},{passive:false});
  btn.addEventListener('touchend',e=>{e.preventDefault();setFn(false);btn.classList.remove('pressed');},{passive:false});
  btn.addEventListener('mousedown',()=>{setFn(val);btn.classList.add('pressed');});
  btn.addEventListener('mouseup',()=>{setFn(false);btn.classList.remove('pressed');});
  btn.addEventListener('mouseleave',()=>{setFn(false);btn.classList.remove('pressed');});
}
addTouch(document.getElementById('btnLeft'),v=>touchLeft=v,true);
addTouch(document.getElementById('btnRight'),v=>touchRight=v,true);
addTouch(document.getElementById('btnJump'),v=>touchJump=v,true);

// ============================
// LOBBY BUTTONS
// ============================
document.getElementById('btnPlay').onclick = () => startGame(1);
document.getElementById('btnLevels').onclick = () => showScreen('levelselect');
document.getElementById('btnShop').onclick = () => showScreen('shop');
document.getElementById('btnBackFromLevels').onclick = () => showScreen('lobby');
document.getElementById('btnBackFromShop').onclick = () => showScreen('lobby');

// Init
showScreen('lobby');
</script>
